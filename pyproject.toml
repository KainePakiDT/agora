[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agora"
version = "0.1.0"
description = "Autonomous multi-agent debate tool powered by Claude"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
]

[project.scripts]
agora = "agora.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["agora"]
