[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agora"
version = "0.1.0"
description = "Autonomous multi-agent debate tool powered by Claude"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
]

[project.scripts]
agora = "agora.cli:app"
agora-setup = "agora.cli:setup"
agora-update = "agora.cli:update"
agora-uninstall = "agora.cli:uninstall"
agora-clean = "agora.cli:clean"
agora-help = "agora.cli:help_cmd"

[tool.hatch.build.targets.wheel]
packages = ["agora"]
